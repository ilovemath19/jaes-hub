<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jae's Hub - Connect 4</title>
<style>body{background:#111;color:#fff;font-family:Arial;text-align:center}.board{display:grid;grid-template-columns:repeat(7,58px);gap:5px;background:#1680d0;padding:8px;width:max-content;margin:15px auto}.cell{width:58px;height:58px;border-radius:50%;background:#eee;cursor:pointer}.r{background:#e33}.y{background:#ffd52a}button{padding:9px 18px;font-size:16px}</style></head><body><h1>🔴🟡 Connect 4</h1><div id="msg">Red's turn</div><div id="b" class="board"></div><button onclick="restart()">Restart</button>
<script>const el=document.getElementById("b"),msg=document.getElementById("msg");let a,turn,done;function restart(){a=Array.from({length:6},()=>Array(7).fill(0));turn=1;done=false;render()}function win(r,c){let v=a[r][c];for(let [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]]){let n=1;for(let z=1;z<4;z++){let R=r+dr*z,C=c+dc*z;if(R<0||R>5||C<0||C>6||a[R][C]!==v)break;n++}for(let z=1;z<4;z++){let R=r-dr*z,C=c-dc*z;if(R<0||R>5||C<0||C>6||a[R][C]!==v)break;n++}if(n>=4)return true}return false}function play(c){if(done)return;for(let r=5;r>=0;r--)if(!a[r][c]){a[r][c]=turn;if(win(r,c)){done=true;msg.textContent=(turn===1?"Red":"Yellow")+" wins!";}else if(a.flat().every(Boolean)){done=true;msg.textContent="Draw!";}else{turn=3-turn;msg.textContent=turn===1?"Red's turn":"Yellow's turn"}render();return}}function render(){el.innerHTML="";for(let r=0;r<6;r++)for(let c=0;c<7;c++){let d=document.createElement("div");d.className="cell "+(a[r][c]===1?"r":a[r][c]===2?"y":"");d.onclick=()=>play(c);el.appendChild(d)}}restart();</script></body></html>
