<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jae's Hub - Snake</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#111827;color:#fff;font-family:Arial,sans-serif}
.game{width:min(95vw,520px);text-align:center;padding:20px}
h1{margin:0 0 8px;font-size:32px}
.score{font-size:20px;margin-bottom:12px}
canvas{width:100%;max-width:400px;aspect-ratio:1;background:#0b1220;border:3px solid #374151;border-radius:10px;display:block;margin:auto}
button{border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer;min-height:44px;padding:10px 20px}
button:hover{background:#1d4ed8}
.restart{margin-top:15px}
.instructions{margin-top:12px;color:#9ca3af;font-size:14px}
.controls{display:grid;grid-template-columns:repeat(3,60px);justify-content:center;gap:6px;margin-top:15px}
.controls button{padding:0;width:60px;height:50px;font-size:22px}
.empty{visibility:hidden}
</style>
</head>
<body>
<div class="game">
<h1>🐍 Snake</h1>
<div class="score">Score: <span id="score">0</span></div>
<canvas id="game" width="400" height="400"></canvas>
<button class="restart" id="restart" type="button">Restart Game</button>
<div class="instructions">Use Arrow Keys or WASD to move</div>
<div class="controls">
<button class="empty" type="button" aria-hidden="true"></button>
<button type="button" data-direction="up">⬆️</button>
<button class="empty" type="button" aria-hidden="true"></button>
<button type="button" data-direction="left">⬅️</button>
<button type="button" data-direction="down">⬇️</button>
<button type="button" data-direction="right">➡️</button>
</div>
</div>
<script>
"use strict";
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const restart=document.getElementById("restart");
const grid=20,tile=canvas.width/grid;
let snake,food,direction,nextDirection,score,gameOver,timer;

function startGame(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  direction={x:1,y:0};
  nextDirection={x:1,y:0};
  score=0; gameOver=false; scoreEl.textContent="0";
  food=createFood();
  clearInterval(timer);
  timer=setInterval(update,110);
  draw();
}
function createFood(){
  let f;
  do{f={x:Math.floor(Math.random()*grid),y:Math.floor(Math.random()*grid)}}
  while(snake.some(s=>s.x===f.x&&s.y===f.y));
  return f;
}
function update(){
  if(gameOver)return;
  direction=nextDirection;
  const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};
  if(head.x<0||head.x>=grid||head.y<0||head.y>=grid){endGame();return}
  const eating=head.x===food.x&&head.y===food.y;
  const bodyToCheck=eating?snake:snake.slice(0,-1);
  if(bodyToCheck.some(s=>s.x===head.x&&s.y===head.y)){endGame();return}
  snake.unshift(head);
  if(eating){score++;scoreEl.textContent=score;food=createFood()}else snake.pop();
  draw();
}
function draw(){
  ctx.fillStyle="#0b1220";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="#172033";ctx.lineWidth=1;
  for(let i=0;i<=grid;i++){
    const p=i*tile;
    ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,canvas.height);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(canvas.width,p);ctx.stroke();
  }
  ctx.fillStyle="#ef4444";
  ctx.beginPath();ctx.arc(food.x*tile+tile/2,food.y*tile+tile/2,tile*.35,0,Math.PI*2);ctx.fill();
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?"#22c55e":"#16a34a";
    ctx.fillRect(s.x*tile+2,s.y*tile+2,tile-4,tile-4);
  });
  if(gameOver){
    ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#fff";ctx.textAlign="center";
    ctx.font="bold 32px Arial";ctx.fillText("Game Over!",canvas.width/2,canvas.height/2-15);
    ctx.font="18px Arial";ctx.fillText("Score: "+score,canvas.width/2,canvas.height/2+20);
  }
}
function endGame(){gameOver=true;clearInterval(timer);draw()}
function changeDirection(d){
  if(gameOver)return;
  if(d.x===-direction.x&&d.y===-direction.y)return;
  nextDirection=d;
}
document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  const keys=["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"," "];
  if(keys.includes(k))e.preventDefault();
  if(k==="arrowup"||k==="w")changeDirection({x:0,y:-1});
  if(k==="arrowdown"||k==="s")changeDirection({x:0,y:1});
  if(k==="arrowleft"||k==="a")changeDirection({x:-1,y:0});
  if(k==="arrowright"||k==="d")changeDirection({x:1,y:0});
  if(k===" "&&gameOver)startGame();
});
document.querySelectorAll("[data-direction]").forEach(b=>{
  b.addEventListener("click",()=>changeDirection({
    up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}
  }[b.dataset.direction]));
});
restart.addEventListener("click",startGame);
startGame();
</script>
</body>
</html>
