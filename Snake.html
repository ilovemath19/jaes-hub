<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jae's Hub - Snake</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .game-container {
      width: min(95vw, 520px);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .score {
      font-size: 20px;
      margin-bottom: 12px;
    }

    canvas {
      width: 100%;
      aspect-ratio: 1;
      background: #0b1220;
      border: 3px solid #374151;
      border-radius: 10px;
      display: block;
    }

    button {
      margin-top: 15px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .instructions {
      margin-top: 12px;
      color: #9ca3af;
      font-size: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      justify-content: center;
      gap: 6px;
      margin-top: 15px;
    }

    .controls button {
      margin: 0;
      padding: 0;
      width: 60px;
      height: 50px;
      font-size: 22px;
    }

    .empty {
      visibility: hidden;
    }
  </style>
</head>

<body>

  <div class="game-container">
    <h1>🐍 Snake</h1>

    <div class="score">
      Score: <span id="score">0</span>
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <button id="restart">Restart Game</button>

    <div class="instructions">
      Use Arrow Keys or WASD to move
    </div>

    <div class="controls">
      <button class="empty"></button>
      <button data-direction="up">⬆️</button>
      <button class="empty"></button>

      <button data-direction="left">⬅️</button>
      <button data-direction="down">⬇️</button>
      <button data-direction="right">➡️</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const restartButton = document.getElementById("restart");

    const gridSize = 20;
    const tileSize = canvas.width / gridSize;

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let gameOver;
    let gameLoop;

    function startGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };

      score = 0;
      gameOver = false;

      scoreElement.textContent = score;

      food = createFood();

      clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);

      draw();
    }

    function createFood() {
      let newFood;

      do {
        newFood = {
          x: Math.floor(Math.random() * gridSize),
          y: Math.floor(Math.random() * gridSize)
        };
      } while (
        snake.some(segment =>
          segment.x === newFood.x &&
          segment.y === newFood.y
        )
      );

      return newFood;
    }

    function update() {
      if (gameOver) return;

      direction = nextDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // Wall collision
      if (
        head.x < 0 ||
        head.x >= gridSize ||
        head.y < 0 ||
        head.y >= gridSize
      ) {
        endGame();
        return;
      }

      // Self collision
      if (
        snake.some(segment =>
          segment.x === head.x &&
          segment.y === head.y
        )
      ) {
        endGame();
        return;
      }

      snake.unshift(head);

      // Food collision
      if (
        head.x === food.x &&
        head.y === food.y
      ) {
        score++;
        scoreElement.textContent = score;
        food = createFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = "#172033";
      ctx.lineWidth = 1;

      for (let i = 0; i <= gridSize; i++) {
        const position = i * tileSize;

        ctx.beginPath();
        ctx.moveTo(position, 0);
        ctx.lineTo(position, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, position);
        ctx.lineTo(canvas.width, position);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = "#ef4444";

      ctx.beginPath();
      ctx.arc(
        food.x * tileSize + tileSize / 2,
        food.y * tileSize + tileSize / 2,
        tileSize * 0.35,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Snake
      snake.forEach((segment, index) => {
        ctx.fillStyle =
          index === 0 ? "#22c55e" : "#16a34a";

        ctx.fillRect(
          segment.x * tileSize + 2,
          segment.y * tileSize + 2,
          tileSize - 4,
          tileSize - 4
        );
      });

      // Game over screen
      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";

        ctx.font = "bold 32px Arial";
        ctx.fillText(
          "Game Over!",
          canvas.width / 2,
          canvas.height / 2 - 15
        );

        ctx.font = "18px Arial";
        ctx.fillText(
          "Score: " + score,
          canvas.width / 2,
          canvas.height / 2 + 20
        );
      }
    }

    function endGame() {
      gameOver = true;
      clearInterval(gameLoop);
      draw();
    }

    function changeDirection(newDirection) {
      if (gameOver) return;

      // Prevent reversing into yourself
      if (
        newDirection.x === -direction.x &&
        newDirection.y === -direction.y
      ) {
        return;
      }

      nextDirection = newDirection;
    }

    document.addEventListener("keydown", function(event) {
      const key = event.key.toLowerCase();

      if (
        [
          "arrowup",
          "arrowdown",
          "arrowleft",
          "arrowright",
          "w",
          "a",
          "s",
          "d",
          " "
        ].includes(key)
      ) {
        event.preventDefault();
      }

      if (key === "arrowup" || key === "w") {
        changeDirection({ x: 0, y: -1 });
      }

      if (key === "arrowdown" || key === "s") {
        changeDirection({ x: 0, y: 1 });
      }

      if (key === "arrowleft" || key === "a") {
        changeDirection({ x: -1, y: 0 });
      }

      if (key === "arrowright" || key === "d") {
        changeDirection({ x: 1, y: 0 });
      }

      if (key === " " && gameOver) {
        startGame();
      }
    });

    document
      .querySelectorAll("[data-direction]")
      .forEach(button => {
        button.addEventListener("click", function() {
          const name = button.dataset.direction;

          const directions = {
            up: { x: 0, y: -1 },
            down: { x: 0, y: 1 },
            left: { x: -1, y: 0 },
            right: { x: 1, y: 0 }
          };

          changeDirection(directions[name]);
        });
      });

    restartButton.addEventListener("click", startGame);

    startGame();
  </script>

</body>
</html>
