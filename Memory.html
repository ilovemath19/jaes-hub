<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jae's Hub - Memory</title>
<style>body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center}.grid{display:grid;grid-template-columns:repeat(4,80px);gap:10px;justify-content:center;margin:20px}.card{height:80px;background:#333;border:2px solid #777;font-size:42px;display:flex;align-items:center;justify-content:center;cursor:pointer}.show{background:#fff}.matched{background:#4a6}button{padding:9px 18px;font-size:16px}</style></head><body><h1>🧠 Memory</h1><div>Moves: <b id="m">0</b></div><div id="g" class="grid"></div><button onclick="restart()">Restart</button>
<script>const symbols=["🍎","🍌","🍇","🍒","🍋","🍉","🥝","🍓"];let cards,open,lock,moves,matched;function restart(){cards=[...symbols,...symbols].sort(()=>Math.random()-.5).map((v,i)=>({v,i,show:false,match:false}));open=[];lock=false;moves=0;matched=0;render()}function click(i){if(lock||cards[i].show||cards[i].match)return;cards[i].show=true;open.push(i);if(open.length===2){moves++;document.getElementById("m").textContent=moves;if(cards[open[0]].v===cards[open[1]].v){cards[open[0]].match=cards[open[1]].match=true;matched+=2;open=[]}else{lock=true;setTimeout(()=>{cards[open[0]].show=cards[open[1]].show=false;open=[];lock=false;render()},700)}}render()}function render(){let g=document.getElementById("g");g.innerHTML="";cards.forEach((c,i)=>{let d=document.createElement("div");d.className="card "+(c.show||c.match?"show ":"")+(c.match?"matched":"");d.textContent=c.show||c.match?c.v:"?";d.onclick=()=>click(i);g.appendChild(d)})}restart();</script></body></html>
