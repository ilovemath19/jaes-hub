<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jae's Hub - Breakout</title><style>
body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center}h1{margin:10px}
canvas{background:#080d18;border:3px solid #fff;max-width:95vw}button{padding:10px 18px;font-size:17px;border:0;border-radius:7px;margin:7px}
</style></head><body><h1>🧱 Breakout</h1><div>Score: <b id="score">0</b> | Lives: <b id="lives">3</b></div>
<canvas id="game" width="600" height="500"></canvas><br><button onclick="restart()">Restart</button>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d"),S=document.getElementById("score"),L=document.getElementById("lives");
let p,b,bricks,score,lives,over,won;
function restart(){p={x:260,y:465,w:80,h:12};b={x:300,y:430,dx:4,dy:-4,r:8};score=0;lives=3;over=won=false;bricks=[];for(let r=0;r<5;r++)for(let col=0;col<9;col++)bricks.push({x:12+col*65,y:35+r*25,w:58,h:18,on:true});requestAnimationFrame(loop)}
function resetBall(){b={x:300,y:430,dx:(Math.random()<.5?-4:4),dy:-4,r:8}}
function loop(){draw();if(over||won)return;b.x+=b.dx;b.y+=b.dy;if(b.x<8||b.x>592)b.dx*=-1;if(b.y<8)b.dy*=-1;
if(b.y+b.r>p.y&&b.x>p.x&&b.x<p.x+p.w&&b.dy>0){b.dy=-Math.abs(b.dy);b.dx+=(b.x-(p.x+p.w/2))/25}
for(const q of bricks)if(q.on&&b.x>q.x&&b.x<q.x+q.w&&b.y-b.r<q.y+q.h&&b.y+b.r>q.y){q.on=false;score+=10;b.dy*=-1;break}
if(b.y>510){lives--;L.textContent=lives;if(lives<=0)over=true;else resetBall()}
if(bricks.every(q=>!q.on))won=true;S.textContent=score;requestAnimationFrame(loop)}
function draw(){ctx.fillStyle="#080d18";ctx.fillRect(0,0,600,500);ctx.fillStyle="#fff";ctx.fillRect(p.x,p.y,p.w,p.h);ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
bricks.forEach(q=>{if(q.on){ctx.fillStyle="#4cf";ctx.fillRect(q.x,q.y,q.w,q.h)}});if(over||won){ctx.fillStyle="rgba(0,0,0,.7)";ctx.fillRect(0,0,600,500);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 38px Arial";ctx.fillText(won?"YOU WIN!":"GAME OVER",300,260)}}
function setP(e){let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*600/r.width;p.x=Math.max(0,Math.min(520,px-40))}
c.addEventListener("mousemove",setP);c.addEventListener("touchmove",e=>{setP(e.touches[0]);e.preventDefault()},{passive:false});
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")p.x=Math.max(0,p.x-35);if(e.key==="ArrowRight")p.x=Math.min(520,p.x+35);if(e.key.toLowerCase()==="r")restart()});restart();
</script></body></html>
