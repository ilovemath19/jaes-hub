<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jae's Hub - Space Invaders</title>
<style>body{margin:0;background:#080808;color:#fff;text-align:center;font-family:Arial}canvas{background:#000;border:3px solid #fff;max-width:95vw}button{padding:9px 18px;font-size:16px;margin:8px}</style></head><body><h1>👾 Space Invaders</h1><div>Score: <b id="s">0</b></div><canvas id="c" width="600" height="650"></canvas><br><button onclick="restart()">Restart</button>
<script>const c=document.getElementById("c"),x=c.getContext("2d");let p,en,shots,score,over,dir;function restart(){p={x:275,y:600};en=[];for(let r=0;r<4;r++)for(let i=0;i<9;i++)en.push({x:70+i*55,y:70+r*40,on:1});shots=[];score=0;over=false;dir=1;requestAnimationFrame(loop)}function loop(){x.fillStyle="#000";x.fillRect(0,0,600,650);x.fillStyle="#4f6";x.fillRect(p.x,p.y,50,18);shots.forEach(q=>q.y-=8);if(en.filter(q=>q.on).some(q=>q.x>520||q.x<20))dir*=-1;en.forEach(q=>{if(q.on){q.x+=dir*1.2;x.fillStyle="#f55";x.fillRect(q.x,q.y,30,20)}});shots.forEach(q=>{x.fillStyle="#fff";x.fillRect(q.x,q.y,4,12)});for(const q of shots)for(const e of en)if(e.on&&q.x>e.x&&q.x<e.x+30&&q.y>e.y&&q.y<e.y+20){e.on=0;q.y=-20;score+=10}shots=shots.filter(q=>q.y>-20);if(en.filter(q=>q.on).length===0)over=true;if(en.some(q=>q.on&&q.y>p.y-20))over=true;document.getElementById("s").textContent=score;if(!over)requestAnimationFrame(loop);else{x.fillStyle="#fff";x.font="40px Arial";x.textAlign="center";x.fillText(en.some(q=>q.on&&q.y>p.y-20)?"GAME OVER":"YOU WIN!",300,330)}}document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")p.x=Math.max(0,p.x-25);if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")p.x=Math.min(550,p.x+25);if(e.code==="Space"&&!over)shots.push({x:p.x+23,y:p.y});if(e.key.toLowerCase()==="r")restart()});restart();</script></body></html>
