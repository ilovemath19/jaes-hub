<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jae's Hub - Pong</title>
<style>body{margin:0;background:#111;color:#fff;text-align:center;font-family:Arial}canvas{background:#000;border:3px solid #fff;max-width:95vw}button{padding:9px 18px;font-size:16px;margin:8px}</style></head><body><h1>🏓 Pong</h1><div id="s">0 - 0</div><canvas id="c" width="700" height="450"></canvas><br><button onclick="restart()">Restart</button>
<script>const c=document.getElementById("c"),x=c.getContext("2d");let p,a,b,ps,as,over;function restart(){p=200;a=200;b={x:350,y:225,dx:5,dy:3};ps=as=0;over=false;requestAnimationFrame(loop)}function loop(){x.fillStyle="#000";x.fillRect(0,0,700,450);x.fillStyle="#fff";x.fillRect(20,p,12,80);x.fillRect(668,a,12,80);x.fillRect(b.x-7,b.y-7,14,14);b.x+=b.dx;b.y+=b.dy;if(b.y<7||b.y>443)b.dy*=-1;a+=((b.y-40)-a)*.06;if(b.x<32&&b.y>p&&b.y<p+80)b.dx=Math.abs(b.dx);if(b.x>660&&b.y>a&&b.y<a+80)b.dx=-Math.abs(b.dx);if(b.x<0){as++;resetBall()}if(b.x>700){ps++;resetBall()}document.getElementById("s").textContent=ps+" - "+as;if(ps>=7||as>=7)over=true;if(!over)requestAnimationFrame(loop);else{x.font="40px Arial";x.textAlign="center";x.fillText("GAME OVER",350,230)}}function resetBall(){b={x:350,y:225,dx:(Math.random()<.5?5:-5),dy:3}}document.addEventListener("keydown",e=>{if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")p=Math.max(0,p-30);if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")p=Math.min(370,p+30);if(e.key.toLowerCase()==="r")restart()});restart();</script></body></html>
